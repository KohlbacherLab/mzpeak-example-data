  input: 'imzML_DESI/ColAd_Individual/120TopL, 90TopR, 110BottomL, 100BottomR/120TopL, 90TopR, 110BottomL, 100BottomR-centroid.imzML'
  flags: '--image "data/imzml-examples/zenodo-DESI/imzML_DESI/ColAd_Individual/120TopL, 90TopR, 110BottomL, 100BottomR/90,100,110,120.jpg"'
