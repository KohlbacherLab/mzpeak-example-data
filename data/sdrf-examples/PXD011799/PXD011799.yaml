id: PXD011799
tile: sdrf-examples
title: <b>TMT 10-plex</b> melanoma B cells
description: PRIDE PXD011799 · <b>TMT 10-plex</b> melanoma B cells (Orbitrap Fusion Lumos; Griss et al. 2019) — the TMT channel-model fixture.
files:
- url: https://raw.githubusercontent.com/bigbio/sdrf-annotated-datasets/main/datasets/PXD011799/PXD011799.sdrf.tsv
  path: PXD011799.sdrf.tsv
convert:
  # SDRF-EMBEDDED demonstrator: the run is converted from mzML with `--sdrf`, which stores the
  # study's SDRF TSV verbatim inside the archive as `sample_metadata/sdrf.tsv`, with
  # `metadata.study` + `metadata.sample_metadata` back-references. So the mzPeak carries its own
  # sample metadata — instrument, labelling, organism, factor values — with no external lookup.
  # `--sdrf` accepts mzML/imzML input only, so this is built from the mzml/ source, not raw/.
  input: mzml/20170131_Lumos_RSLC4_Maurer_Hartl_UW_MFPL_TiO2_TMT_fr9.mzML
  flags: --zstd-level 12 --sdrf PXD011799.sdrf.tsv
